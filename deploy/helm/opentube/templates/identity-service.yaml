apiVersion: v1
kind: Service
metadata: { name: identity-service }
spec:
  selector: { app: identity-service }
  ports: [{ name: http, port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: identity-service }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  replicas: 2
  selector: { matchLabels: { app: identity-service } }
  template:
    metadata: { labels: { app: identity-service } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: identity-service
          image: {{ .Values.images.identity }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:8081
            - name: IDENTITY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: identity-password } }
            - name: DATABASE_URL
              value: postgres://identity_service:$(IDENTITY_DB_PASSWORD)@postgres:5432/opentube
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: jwt-secret } }
            - name: SEED_EMAIL
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: seed-email } }
            - name: SEED_PASSWORD
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: seed-password } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources:
            requests:
              cpu: {{ .Values.resources.identity.requests.cpu | quote }}
              memory: {{ .Values.resources.identity.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.identity.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.identity.limits.cpu | quote }}
              memory: {{ .Values.resources.identity.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.identity.limits "ephemeral-storage" | quote }}
