apiVersion: v1
kind: Service
metadata: { name: video-service }
spec:
  selector: { app: video-service }
  ports: [{ name: http, port: 8082, targetPort: 8082 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: video-service }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  replicas: 2
  selector: { matchLabels: { app: video-service } }
  template:
    metadata: { labels: { app: video-service } }
    spec:
      containers:
        - name: video-service
          image: {{ .Values.images.video }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8082 }]
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:8082
            - name: VIDEO_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: video-password } }
            - name: DATABASE_URL
              value: postgres://video_service:$(VIDEO_DB_PASSWORD)@postgres:5432/opentube
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: jwt-secret } }
            - name: WORKER_TOKEN
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: worker-token } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: minio-root-user } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: minio-root-password } }
            - { name: S3_BUCKET, value: opentube }
            - { name: S3_REGION, value: us-east-1 }
            - { name: S3_ENDPOINT, value: http://minio:9000 }
            - { name: S3_PUBLIC_ENDPOINT, value: http://127.0.0.1:19000 }
            - { name: MEDIA_PUBLIC_BASE, value: http://127.0.0.1:19000 }
            - name: RABBIT_USER
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: rabbit-user } }
            - name: RABBIT_PASSWORD
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: rabbit-password } }
            - name: RABBITMQ_URL
              value: amqp://$(RABBIT_USER):$(RABBIT_PASSWORD)@rabbitmq:5672/%2f
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.resources.video | nindent 12 }}
