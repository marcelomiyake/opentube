apiVersion: v1
kind: Service
metadata: { name: web-frontend }
spec:
  selector: { app: web-frontend }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web-frontend }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  replicas: 2
  selector: { matchLabels: { app: web-frontend } }
  template:
    metadata: { labels: { app: web-frontend } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: {{ .Values.images.web }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests:
              cpu: {{ .Values.resources.web.requests.cpu | quote }}
              memory: {{ .Values.resources.web.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.web.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.resources.web.limits.cpu | quote }}
              memory: {{ .Values.resources.web.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.resources.web.limits "ephemeral-storage" | quote }}
