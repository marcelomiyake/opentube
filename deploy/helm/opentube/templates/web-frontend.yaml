apiVersion: v1
kind: Service
metadata: { name: web-frontend }
spec:
  selector: { app: web-frontend }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web-frontend }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  replicas: 2
  selector: { matchLabels: { app: web-frontend } }
  template:
    metadata: { labels: { app: web-frontend } }
    spec:
      containers:
        - name: nginx
          image: {{ .Values.images.web }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
