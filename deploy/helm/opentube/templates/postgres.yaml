apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              value: opentube
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: database-admin-user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: database-admin-password } }
            - name: IDENTITY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: identity-password } }
            - name: VIDEO_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: video-password } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/01-users.sh, subPath: 01-users.sh }
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
      volumes:
        - name: init
          configMap: { name: opentube-config, items: [{ key: POSTGRES_INIT, path: 01-users.sh, mode: 0755 }] }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
