apiVersion: v1
kind: ConfigMap
metadata:
  name: opentube-config
data:
  POSTGRES_DB: opentube
  PGHOST: postgres
  PGPORT: "5432"
  IDENTITY_DB_USER: identity_service
  VIDEO_DB_USER: video_service
  S3_BUCKET: opentube
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://127.0.0.1:19000
  MEDIA_PUBLIC_BASE: http://127.0.0.1:19000
  RABBITMQ_HOST: rabbitmq
  VIDEO_SERVICE_URL: http://video-service:8082
  POSTGRES_INIT: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    CREATE ROLE identity_service LOGIN PASSWORD '${IDENTITY_DB_PASSWORD}';
    CREATE ROLE video_service LOGIN PASSWORD '${VIDEO_DB_PASSWORD}';
    CREATE SCHEMA identity AUTHORIZATION identity_service;
    CREATE SCHEMA video AUTHORIZATION video_service;
    ALTER ROLE identity_service SET search_path TO identity;
    ALTER ROLE video_service SET search_path TO video;
    GRANT CONNECT ON DATABASE opentube TO identity_service, video_service;
    GRANT CREATE ON DATABASE opentube TO identity_service, video_service;
    SQL
  NGINX_CONFIG: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location = /api/v1/login {
        proxy_pass http://identity-service:8081/v1/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location /api/ {
        proxy_pass http://video-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
