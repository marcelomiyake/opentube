apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports: [{ name: api, containerPort: 9000 }, { name: console, containerPort: 9001 }]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: minio-root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: opentube-secrets, key: minio-root-password } }
            - { name: MINIO_API_CORS_ALLOW_ORIGIN, value: "*" }
          readinessProbe: { httpGet: { path: /minio/health/ready, port: api }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources:
            {{- toYaml .Values.resources.minio | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 4Gi } }
