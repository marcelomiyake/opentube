apiVersion: v1
kind: Secret
metadata:
  name: opentube-secrets
type: Opaque
stringData:
  {{- $credentials := .Values.localCredentials | default dict }}
  database-admin-user: {{ required "localCredentials.databaseAdminUser is required" (get $credentials "databaseAdminUser") | quote }}
  database-admin-password: {{ required "localCredentials.databaseAdminPassword is required" (get $credentials "databaseAdminPassword") | quote }}
  identity-password: {{ required "localCredentials.identityPassword is required" (get $credentials "identityPassword") | quote }}
  video-password: {{ required "localCredentials.videoPassword is required" (get $credentials "videoPassword") | quote }}
  minio-root-user: {{ required "localCredentials.minioRootUser is required" (get $credentials "minioRootUser") | quote }}
  minio-root-password: {{ required "localCredentials.minioRootPassword is required" (get $credentials "minioRootPassword") | quote }}
  rabbit-user: {{ required "localCredentials.rabbitUser is required" (get $credentials "rabbitUser") | quote }}
  rabbit-password: {{ required "localCredentials.rabbitPassword is required" (get $credentials "rabbitPassword") | quote }}
  jwt-secret: {{ required "localCredentials.jwtSecret is required" (get $credentials "jwtSecret") | quote }}
  worker-token: {{ required "localCredentials.workerToken is required" (get $credentials "workerToken") | quote }}
  seed-email: {{ required "localCredentials.seedEmail is required" (get $credentials "seedEmail") | quote }}
  seed-password: {{ required "localCredentials.seedPassword is required" (get $credentials "seedPassword") | quote }}
